<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../assets/favicon.ico">
    <title>CSE 135 Team Ate</title>
    <style>
        :root {
            --bg: #fdfdfd;
            --text: #333;
            --accent: #883eff;
            --secondary: #64748b;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            line-height: 1.6;
            color: var(--text, #333);
            background-color: var(--bg, #fdfdfd);
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        a {
                text-decoration: none;
                color: var(--accent, #5c59fd);
                position: relative;
                display: inline-block;
        }

        a::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: var(--accent, #5c59fd);
            
            transform: scaleX(0);
            transform-origin: bottom right;
            transition: transform 0.3s ease-out;
        }

        a:hover {
            color: #2a2899
        }

        a:hover::after {
            transform: scaleX(1);
            transform-origin: bottom left;
        }

        header {
            border-bottom: 2px solid #eee;
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }

        h1 { 
            margin: 0; 
            color: var(--accent, #5c59fd); 
        }
        
        main {
            display: grid;
            gap: 2rem;
        }
        
        h2 { 
            color: var(--secondary, #64748b); 
            border-left: 4px solid var(--accent, #5c59fd); 
            padding-left: 10px; 
        }

        section {
            background: #f8fafc;
            padding: 1.5rem;
            border-radius: 8px;
        }

        section > ul {
            padding-left: 1.2rem;
        }

        section > ul > li { 
            margin-bottom: 0.5rem; 
        }

        footer {
            margin-top: 3rem;
            font-size: 0.9rem;
            color: var(--secondary, #64748b);
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>CSE 135 Winter 2026 - Team Ate</h1>
    </header>

    <main>
        <img src="./assets/team-mascot.png" width="200px" height="200px">

        <section>
          <h2>Members of Team Ate</h2>
          <ul>
            <li><a href="/members/arlenegarcia.html">Arlene Garcia</a></li>
            <li><a href="/members/ashleyvo.html">Ashley Vo</a></li>
            <li><a href="/members/kietdang.html">Kiet Dang</a></li>
          </ul>
        </section>

        <section>
            <h2>Assignments</h2>
            
            <article>
              <h3>Homework 1</h3>
              <ul>
                <li>This is a <a href="./assets/big_text.txt">compression test with a big text file</a>!</li>
                <li>Item 2</li>
              </ul>
            </article>

            <article>
              <h3>Homework 2</h3>
              <ul>
                <li>TBA</li>
              </ul>
            </article>

        </section>
    </main>
</body>
</html>
