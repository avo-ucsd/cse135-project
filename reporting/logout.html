<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="2; url=/login.html">
    <title>Logging out...</title>
    <style>
        :root {
            --bg: #fdfdfd;
            --text: #333;
            --accent: #883eff;
            --secondary: #64748b;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            color: var(--text);
            background-color: var(--bg);
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        header {
            border-bottom: 2px solid #eee;
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }

        h1 { margin: 0; color: var(--accent); }

        .card {
            background: #f8fafc;
            padding: 1.5rem;
            border-radius: 8px;
            color: var(--secondary);
        }
    </style>
</head>
<body>
    <header><h1>Reporting</h1></header>
    <main>
        <div class="card">
            Logging out, please wait...
        </div>
    </main>
</body>
</html>
