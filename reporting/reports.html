<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports — Team Ate Analytics</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="analytics.css">
  <link rel="stylesheet" href="reports.css">
  <link rel="stylesheet" href="bootstrap-bridge.css">
  <script src="/components/Header.js" defer></script>
</head>
<body class="bg-body-tertiary">

  <site-header></site-header>

  <main class="container-xl">
    <section class="page-header" aria-labelledby="reports-title">
      <hgroup>
        <p class="eyebrow">Analytics</p>
        <h1 id="reports-title">Reports</h1>
      </hgroup>
      <p class="page-subtitle">Saved PDF-ready snapshots for analysts.</p>
    </section>

    <section class="table-section" aria-labelledby="reports-table-heading">
      <header class="section-header">
        <h2 id="reports-table-heading">Saved Reports</h2>
        <p class="section-subtitle">Click a row to open the PDF print view.</p>
      </header>
      <figure>
        <table class="reports-table table table-hover align-middle mb-0">
          <caption class="sr-only">Saved reports list with name, date, and category.</caption>
          <thead>
            <tr>
              <th scope="col">Name</th>
              <th scope="col">Category</th>
              <th scope="col">Status</th>
              <th scope="col">Saved</th>
              <th scope="col">Open</th>
              <th scope="col">Delete</th>
            </tr>
          </thead>
          <tbody id="reportsTableBody"></tbody>
        </table>
      </figure>
    </section>
  </main>

  <script type="module" src="reports.js"></script>

  <footer role="contentinfo" class="container-xl py-3">
    <p>Connected to <abbr title="DigitalOcean Droplet">DO</abbr> / Apache / MySQL; Made with love by Team Ate (and Claude AI)</p>
  </footer>
</body>
</html>
