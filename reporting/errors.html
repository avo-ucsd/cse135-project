<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Errors &amp; Reliability — Team Ate Analytics</title>
  <link rel="stylesheet" href="analytics.css">
  <link rel="stylesheet" href="errors.css">
  <script src="/components/Header.js" defer></script>
</head>
<body>

  <site-header></site-header>

  <main>
    <section aria-labelledby="page-title" class="page-header">
      <hgroup>
        <p class="eyebrow">Analytics</p>
        <h1 id="page-title">Errors &amp; Reliability</h1>
      </hgroup>
    </section>

    <section aria-label="Error metrics" class="kpi-strip">
      <article class="kpi-card" data-kpi="total-errors">
        <h2>Total Errors</h2>
        <p class="kpi-value">…</p>
        <p class="kpi-delta"></p>
      </article>
      <article class="kpi-card" data-kpi="affected-pages">
        <h2>Affected Pages</h2>
        <p class="kpi-value">…</p>
        <p class="kpi-delta"></p>
      </article>
      <article class="kpi-card" data-kpi="error-rate">
        <h2>Error Rate</h2>
        <p class="kpi-value">…</p>
        <p class="kpi-delta"></p>
      </article>
      <article class="kpi-card" data-kpi="error-sessions">
        <h2>Sessions w/ Errors</h2>
        <p class="kpi-value">…</p>
        <p class="kpi-delta"></p>
      </article>
    </section>

    <div class="chart-grid">
      <section aria-labelledby="trend-heading" class="chart-section">
        <h2 id="trend-heading">Error Trend</h2>
        <figure>
          <canvas id="errorTrendChart" width="500" height="280"
            aria-label="Line chart of daily error counts over 30 days" role="img"></canvas>
          <figcaption>Daily errors, last 30 days</figcaption>
          <div class="tooltip" id="trendTooltip"></div>
        </figure>
      </section>

      <section aria-labelledby="top-pages-chart-heading" class="chart-section">
        <h2 id="top-pages-chart-heading">Top Affected Pages</h2>
        <figure>
          <canvas id="topPagesChart" width="500" height="280"
            aria-label="Bar chart of pages ranked by error count" role="img"></canvas>
          <figcaption>Pages ranked by total errors</figcaption>
          <div class="tooltip" id="topPagesTooltip"></div>
        </figure>
      </section>
    </div>

    <section aria-labelledby="error-log-heading" class="table-section">
      <header class="section-header">
        <h2 id="error-log-heading">Recent Error Log</h2>
      </header>
      <figure>
        <table>
          <caption class="sr-only">Most recent error events</caption>
          <thead>
            <tr>
              <th scope="col">Time</th>
              <th scope="col">Page</th>
              <th scope="col">Error Type</th>
              <th scope="col">Message</th>
              <th scope="col">Count</th>
              <th scope="col">Session</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </figure>
    </section>

    <section aria-labelledby="top-pages-table-heading" class="table-section">
      <header class="section-header">
        <h2 id="top-pages-table-heading">Top Pages by Error Count</h2>
      </header>
      <figure>
        <table>
          <caption class="sr-only">Pages ranked by total errors</caption>
          <thead>
            <tr>
              <th scope="col">#</th>
              <th scope="col">Page</th>
              <th scope="col">Total Errors</th>
              <th scope="col">Last Seen</th>
            </tr>
          </thead>
          <tbody id="topPagesTableBody"></tbody>
        </table>
      </figure>
    </section>
  </main>

  <script type="module" src="errors.js"></script>

  <footer role="contentinfo">
    <p>Connected to <abbr title="DigitalOcean Droplet">DO</abbr> / Apache / MySQL; Made with love by Team Ate (and Claude AI)</p>
  </footer>
</body>
</html>
