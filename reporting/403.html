<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 Forbidden – Team Ate Analytics</title>
  <link rel="stylesheet" href="/analytics.css">
  <script src="/components/Header.js" defer></script>
  <style>
    .error-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem var(--gap);
      gap: 1rem;
    }

    .error-code {
      font-size: 6rem;
      font-weight: 700;
      letter-spacing: -0.05em;
      color: var(--negative);
      font-family: var(--font-mono);
      line-height: 1;
    }

    .error-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.03em;
    }

    .error-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
      max-width: 420px;
    }

    .error-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      display: inline-block;
      padding: 0.5rem 1.25rem;
      border-radius: var(--radius);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, transform 0.1s;
    }
    .btn:hover { text-decoration: none; transform: scale(1.02); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
    }
    .btn-primary:hover { background: #9c3de0; }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
  </style>
</head>
<body>

  <site-header></site-header>

  <main>
    <div class="error-page">
      <p class="error-code">403</p>
      <p class="error-title">Access Denied</p>
      <p class="error-desc">You don't have permission to view this page. Contact your administrator if you think this is a mistake.</p>
      <div class="error-actions">
        <a href="/index.html" class="btn btn-primary">Go to Dashboard</a>
        <a href="javascript:history.back()" class="btn btn-ghost">Go Back</a>
      </div>
    </div>
  </main>

  <footer role="contentinfo">
    <p>Connected to <abbr title="DigitalOcean Droplet">DO</abbr> / Apache / MySQL; Made with love by Team Ate (and Claude AI)</p>
  </footer>

</body>
</html>
