<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Reporting</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
        }

        .login-shell {
            min-height: 100vh;
        }

        .login-card {
            max-width: 430px;
            width: 100%;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
        }

        .login-brand {
            letter-spacing: -0.02em;
        }
    </style>
</head>

<body>
    <main class="container d-flex align-items-center justify-content-center login-shell py-5">
        <section class="card shadow-sm login-card">
            <div class="card-body p-4 p-md-5">
                <header class="mb-4 text-center">
                    <h1 class="h3 fw-bold text-primary login-brand mb-1">Reporting</h1>
                    <p class="text-secondary mb-0">Team Ate Analytics Portal</p>
                </header>

                <h2 class="h5 mb-3">Sign In</h2>

            <div class="alert alert-danger" role="alert" id="error-msg" style="display:none;">
                Invalid username or password. Please try again.
            </div>

            <form method="POST" action="/j_security_check" class="d-grid gap-3">
                <div>
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" class="form-control" name="httpd_username" autocomplete="username" required>
                </div>
                <div>
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" name="httpd_password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Log In</button>
            </form>
            </div>
        </section>
    </main>

    <script>
        if (new URLSearchParams(window.location.search).has('failed')) {
            document.getElementById('error-msg').style.display = 'block';
        }
    </script>
</body>
</html>
