name: Deploy to Digital Ocean

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts
      
      - name: Get changed files
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            collector:
              - 'collector/**'
            reporting:
              - 'reporting/**'
            www:
              - 'www/**'
            www_cgi:
              - 'www-cgi-bin/**'
      
      - name: Deploy collector
        if: steps.changes.outputs.collector == 'true'
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: rsync -avz --delete collector/ $SERVER_USER@$SERVER_IP:/var/www/collector.teamate.site/public_html
      
      - name: Deploy reporting
        if: steps.changes.outputs.reporting == 'true'
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: rsync -avz --delete reporting/ $SERVER_USER@$SERVER_IP:/var/www/reporting.teamate.site/public_html
      
      - name: Deploy www
        if: steps.changes.outputs.www == 'true'
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: rsync -avz --delete www/ $SERVER_USER@$SERVER_IP:/var/www/teamate.site/public_html
      
      - name: Deploy www CGI scripts
        if: steps.changes.outputs.www_cgi == 'true'
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          rsync -avz --delete www-cgi-bin/ $SERVER_USER@$SERVER_IP:/var/www/teamate.site/cgi-bin/
          ssh $SERVER_USER@$SERVER_IP 'chmod +x /var/www/teamate.site/cgi-bin/*.cgi /var/www/teamate.site/cgi-bin/*.pl /var/www/teamate.site/cgi-bin/*.py 2>/dev/null || true'