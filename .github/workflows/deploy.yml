name: Deploy to Digital Ocean

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts
      
      - name: Get changed files
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            collector:
              - 'collector/**'
            reporting:
              - 'reporting/**'
            www:
              - 'www/**'
            www_cgi:
              - 'www-cgi-bin/**'
            test:
              - 'test/**'
      
      - name: Deploy collector
        if: steps.changes.outputs.collector == 'true'
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: rsync -avz --delete collector/ $SERVER_USER@$SERVER_IP:/var/www/collector.teamate.site/public_html
      
      - name: Deploy reporting
        if: steps.changes.outputs.reporting == 'true'
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: rsync -avz --delete reporting/ $SERVER_USER@$SERVER_IP:/var/www/reporting.teamate.site/public_html
      
      - name: Deploy www
        if: steps.changes.outputs.www == 'true'
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: rsync -avz --delete www/ $SERVER_USER@$SERVER_IP:/var/www/teamate.site/public_html
      
      - name: Deploy test
        if: steps.changes.outputs.test == 'true'
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: rsync -avz --delete test/ $SERVER_USER@$SERVER_IP:/var/www/test.teamate.site/public_html
      
      - name: Compile C++ CGI scripts
        if: steps.changes.outputs.www_cgi == 'true'
        run: |
          cd www-cgi-bin
          for cpp_file in *.cpp; do
            if [ -f "$cpp_file" ]; then
              g++ -o "${cpp_file%.cpp}.cgi" "$cpp_file"
            fi
          done

      - name: Deploy www CGI scripts
        if: steps.changes.outputs.www_cgi == 'true'
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          rsync -avz --delete --exclude='*.cpp' www-cgi-bin/ $SERVER_USER@$SERVER_IP:/var/www/teamate.site/cgi-bin/
          ssh $SERVER_USER@$SERVER_IP 'chmod +x /var/www/teamate.site/cgi-bin/*.cgi /var/www/teamate.site/cgi-bin/*.pl /var/www/teamate.site/cgi-bin/*.py 2>/dev/null || true'
```

**Changes made:**

1. Added `test: - 'test/**'` to the path filters
2. Added a new "Deploy test" step that syncs `test/` folder to `/var/www/test.teamate.site/public_html`

**Your repo structure should now be:**
```
repo/
├── collector/
├── reporting/
├── www/
├── www-cgi-bin/
├── test/          ← new folder
└── .github/workflows/deploy.yml